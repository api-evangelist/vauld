name: Vauld
description: >-
  Vauld (formerly Bank of Hodlers) is a crypto asset management platform founded
  in India and headquartered in Singapore, backed by Peter Thiel's Valar
  Ventures, Pantera Capital, and Coinbase Ventures. Its Enterprise API exposes
  wallets, INR fiat rails, KYC verification, crypto swaps, borrowing, and
  lending to partner organisations, authenticated with HMAC-SHA256 request
  signing. Vauld suspended customer withdrawals in July 2022 and entered
  creditor-protection restructuring in Singapore; the API documentation remains
  published and the platform API still responds, though the documented testnet
  hosts no longer resolve.

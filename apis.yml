apis:
- name: Vauld Enterprise API
  description: >-
    Enterprise API for partner organisations covering fiat<>crypto trading on
    India INR rails (deposits via Cards/UPI/NEFT/IMPS/RTGS), automated KYC
    verification (Aadhar/PAN/VoterID/Passport), crypto<>crypto swaps, custodial
    wallets, collateralized borrowing, and interest-earning lending. All
    operations are HTTP POST with JSON bodies signed via HMAC-SHA256. The
    documented testnet base (apis.bankofhodlers.com) no longer resolves;
    production URLs and API keys are issued on request.
  humanURL: https://docs.vauld.com/
